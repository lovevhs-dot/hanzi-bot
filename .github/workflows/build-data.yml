name: build-data

# Downloads the dictionaries, cross-checks them and saves data/hanzi.json.gz.
# Run it once by hand after setup; after that it refreshes monthly.
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hanzi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build and check the data
        run: python3 build_data.py

      - name: Save data
        run: |
          git config user.name "hanzi-bot"
          git config user.email "hanzi-bot@users.noreply.github.com"
          git add data/hanzi.json.gz
          git diff --cached --quiet || (git commit -m "update dictionary data" && git push)
