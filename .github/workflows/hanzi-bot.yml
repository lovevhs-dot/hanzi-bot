name: hanzi-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; an external cron calling workflow_dispatch every 5 min answers faster
  workflow_dispatch:          # lets you run it manually from the Actions tab (or from an external cron)

permissions:
  contents: write

concurrency:
  group: hanzi   # shared with build-data so they never push at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always start from the newest saved state, not the one from when the run was queued

      - name: Answer messages
        run: python3 hanzi_bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}   # encrypts your saved list (state.enc)

      - name: Save state
        run: |
          git config user.name "hanzi-bot"
          git config user.email "hanzi-bot@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || (git commit -m "update state" && git push)
